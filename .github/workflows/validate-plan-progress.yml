name: validate-plan-progress

# Guards every fixture suite under executing-plans/tests/ — despite the name, this
# workflow is not plan-progress-only. It also runs test-gate-remediation-contract.py,
# the structure suite pinning the gate-remediation contract (round budget, severity
# vocabulary, exit criterion) and the honest-gates behavioral-claim wiring.
#
# plan-progress.py turns the
# .claude/plan-progress.json state file (maintained by the executing-plans
# skill at each execution transition) plus the plan's authoritative Status
# fields (parsed via the shared portfolio-unify plan-parser regexes) into a
# one-line progress bar. The fixture suite asserts the silence-when-idle
# contract (a statusline must never print a traceback), the Status counts,
# bar geometry, per-phase glyphs, walk-up discovery, and staleness marking.

on:
  push:
    paths:
      - 'planning/skills/executing-plans/scripts/plan-progress.py'
      - 'planning/skills/executing-plans/tests/**'
      - 'planning/skills/portfolio/scripts/portfolio-unify.py'
  pull_request:
    paths:
      - 'planning/skills/executing-plans/scripts/plan-progress.py'
      - 'planning/skills/executing-plans/tests/**'
      - 'planning/skills/portfolio/scripts/portfolio-unify.py'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install pyyaml
      # Every suite in the directory, not just plan-progress.py by name. The path
      # filter above already watches `tests/**`, so a suite added there was being
      # *triggered* on but never *run* — which is how test-gate-remediation-contract.py
      # (the sole mechanical guard over the gate-remediation contract and the
      # behavioral-claim wiring) shipped with zero CI coverage. Globbing means the next
      # suite added here is covered without anyone remembering this file.
      - name: Run every executing-plans fixture suite
        run: |
          set -euo pipefail
          shopt -s nullglob
          suites=(planning/skills/executing-plans/tests/test-*.py)
          if [ ${#suites[@]} -eq 0 ]; then
            echo "No suites found — the glob is wrong, not the tree." >&2
            exit 1
          fi
          echo "Running ${#suites[@]} suite(s):"
          printf '  %s\n' "${suites[@]}"
          for t in "${suites[@]}"; do
            echo "== $t"
            python3 "$t"
          done
