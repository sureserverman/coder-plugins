name: validate-doc-coverage

# Guards the plugin README contract (docs/plugin-readme-contract.md): every
# plugin the marketplace ships has a README, and every component on disk is
# named in it. The failure this prevents is silent — a plugin gains a skill and
# the README, which nothing checks, quietly stops describing what ships.
#
# Coverage only. The guard cannot tell a usage section from a name in a list;
# see the contract for what it deliberately does not enforce.

on:
  # NO path filters, deliberately. The job is a sub-second Python run, and a
  # filtered trigger is a maintenance hazard that already bit once: when the
  # guard grew to cover hooks, .mcp.json and scripts/validate.sh, the filters
  # were not extended, so the exact scenario the extension existed for — a
  # plugin silently gaining a hook or a determinism lane — was a push on which
  # this workflow never ran. The guard caught it; CI would not have.
  # Every future component type is covered here for free.
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Guard fixture tests (the guard's own logic)
        run: python3 scripts/tests/test-doc-coverage.py
      - name: Component coverage across every plugin README
        run: python3 scripts/check-doc-coverage.py
      - name: Coverage summary (informational)
        if: always()
        run: python3 scripts/check-doc-coverage.py --summary
