name: validate-business-scan

# Guards the business plugin's deterministic evidence lane. business-scan.py is
# the SOLE parser of the per-project business artifacts (BUSINESS.md frontmatter,
# metrics.md, gtm-plan.md) and emits one JSON contract that every business skill
# and the planning-plugin portfolio/compass integration consume. The fixture
# suite asserts that contract, the degrade-never-drop rules, schema-version
# handling, and the read-only guarantee. It reuses staged-planning's
# lib/plan_parser.py CHECKED/UNCHECKED regexes, which live in another repo, so a
# change there does not trigger this; the suite plants a copy under
# STAGED_PLANNING_ROOT.

on:
  push:
    paths:
      - 'business/scripts/**'
      - 'business/skills/**'
      - 'business/references/**'
      - 'business/agents/**'
  pull_request:
    paths:
      - 'business/scripts/**'
      - 'business/skills/**'
      - 'business/references/**'
      - 'business/agents/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Run all business script fixture tests
        run: |
          for t in business/scripts/tests/test-*.py; do
            echo "== $t =="
            python3 "$t"
          done
